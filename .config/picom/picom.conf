# ~/.config/picom/picom.conf

# Backend: try GLX first for smoother vsync
backend = "glx";
vsync = true;


# NVIDIA-friendly GLX flags
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
# Performance
use-damage = true;          # enable damage tracking for perf
unredir-if-possible = true; # disable compositor when fullscreen


# Shadows
shadow = true;
shadow-radius = 12;         # blur size
shadow-opacity = 0.25;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
  "class_g = 'Dunst'",      # no shadow for notifications
  "class_g = 'slop'"        # no shadow for selection boxes
];

# Fading (open/close)
fading = true;
fade-in-step = 0.03;        # 30ms per frame
fade-out-step = 0.03;
fade-delta = 10;

# Transparency
inactive-opacity = 0.98;     # don't dim inactive windows
frame-opacity = 1.0;
inactive-opacity-override = false;

# Blur background behind transparent windows
blur-method = "dual_kawase";
blur-strength = 4;


# Focus fixes
detect-rounded-corners = true;
detect-client-leader = true;
detect-transient = true;


opacity-rule = [
  "95:class_g = 'St'",         # for st terminal
  "95:class_g = 'Alacritty'",
  "95:class_g = 'kitty'"
];
